name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        shell: cmd
        run: tests\run-tests.cmd

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build\Ow2ServerPicker.exe dist\
          Copy-Item data\servers.json dist\
          Copy-Item README.md, LICENSE, install.cmd, uninstall.cmd dist\
          New-Item -ItemType Directory -Path dist\tools -Force | Out-Null
          Copy-Item tools\capture-server.ps1 dist\tools\

      - uses: actions/upload-artifact@v4
        with:
          name: Ow2ServerPicker
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath Ow2ServerPicker.zip
          gh release create "$env:GITHUB_REF_NAME" Ow2ServerPicker.zip `
            --title "$env:GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
